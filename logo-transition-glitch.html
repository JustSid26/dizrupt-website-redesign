<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dizrupt — Full Word Glitch Transition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --purple: #a310e7; --ease: cubic-bezier(.16, 1, .3, 1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050507; color: #fff; }
    body { font-family: "Inter Tight", sans-serif; }
    button { color: inherit; font: inherit; border: 0; background: none; cursor: pointer; }

    .scene { position: fixed; inset: 0; display: grid; place-items: center; background: #050507; }
    .scene::before {
      content: ""; position: absolute; inset: -25%; opacity: .16; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.85'/%3E%3C/svg%3E");
      animation: grain .18s steps(2) infinite;
    }
    @keyframes grain {
      0% { transform: translate3d(-2%, -2%, 0); }
      25% { transform: translate3d(2%, -1%, 0); }
      50% { transform: translate3d(-1%, 2%, 0); }
      75% { transform: translate3d(1%, 1%, 0); }
      100% { transform: translate3d(0, -2%, 0); }
    }

    .word-stage { position: relative; z-index: 2; width: max-content; }
    .word, .glitch-layer {
      font-size: clamp(64px, 15vw, 230px); font-weight: 500; line-height: .86;
      letter-spacing: -.025em; white-space: nowrap;
    }
    .word .z, .glitch-layer .z { display: inline-block; color: var(--purple); transform: scaleX(-1); }
    .glitch-layer {
      position: absolute; inset: 0; opacity: 0; pointer-events: none;
      mix-blend-mode: screen; will-change: transform, clip-path, opacity;
    }
    .glitch-layer.red { color: #ff244f; }
    .glitch-layer.cyan { color: #21dcff; }
    .glitch-layer.white { color: #fff; }
    .word-stage.glitching .word { will-change: transform, opacity, filter; }
    .word-stage.gone { visibility: hidden; }

    .flash {
      position: fixed; inset: 0; z-index: 4; opacity: 0; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
    }
    .flash.hit { animation: flash .22s steps(2) both; }
    @keyframes flash { 35% { opacity: .7; } 100% { opacity: 0; } }

    .mark {
      --size: clamp(230px, 31vw, 370px);
      position: fixed; left: 50%; top: 50%; z-index: 3;
      width: calc(var(--size) * .68); height: var(--size);
      color: #fff; opacity: 0; visibility: hidden;
      transform: translate(-50%, -50%) scale(1.08); filter: blur(5px);
      transform-origin: center; will-change: left, top, transform, filter, opacity;
    }
    .mark.visible {
      opacity: 1; visibility: visible; filter: blur(0);
      transform: translate(-50%, -50%) scale(1);
      transition: opacity .06s linear, filter .18s ease-out, transform .32s var(--ease);
    }
    .mark.dock {
      --size: 58px;
      left: 34px; top: 26px;
      transform: translate(0, 0) scale(1); filter: none;
      transition: left .72s var(--ease), top .72s var(--ease), width .72s var(--ease),
        height .72s var(--ease), opacity .1s linear;
    }
    .glyph {
      position: absolute; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%);
      font-size: calc(var(--size) * var(--fs)); font-style: normal; font-weight: 500;
      line-height: .72; letter-spacing: -.07em; transform: translate(-50%, -50%) rotate(var(--r));
    }
    .glyph.z { color: var(--purple); transform: translate(-50%, -50%) rotate(var(--r)) scaleX(-1); }

    .hint {
      position: fixed; left: 50%; bottom: 28px; z-index: 5; translate: -50% 0;
      font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.45);
      transition: opacity .2s linear;
    }
    body.running .hint { opacity: 0; }
    .reset {
      position: fixed; right: 28px; top: 26px; z-index: 5; padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.2); border-radius: 100px;
      font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    body.finished .reset { opacity: .65; pointer-events: auto; }
    .reset:hover { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .scene::before { animation: none; }
      .mark, .mark.visible, .mark.dock { transition: none; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="word-stage" id="word-stage" aria-label="Dizrupt">
      <div class="word" aria-hidden="true">DI<span class="z">Z</span>RUPT</div>
      <div class="glitch-layer red" aria-hidden="true">DI<span class="z">Z</span>RUPT</div>
      <div class="glitch-layer cyan" aria-hidden="true">DI<span class="z">Z</span>RUPT</div>
      <div class="glitch-layer white" aria-hidden="true">DI<span class="z">Z</span>RUPT</div>
    </div>
    <div class="mark" id="mark" aria-label="Dizrupt compact mark"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>
  </main>
  <p class="hint">Scroll to test transition</p>
  <button class="reset" id="reset">Replay</button>

  <script>
    const layout = [
      ['D', 39, 61, .43, 0], ['I', 20, 31, .39, 0], ['Z', 49, 58, .47, -31],
      ['R', 74, 49, .40, 0], ['U', 39, 46, .42, 0], ['P', 31, 80, .40, 0],
      ['T', 48, 16, .43, 0],
    ];
    const stage = document.querySelector('#word-stage');
    const mark = document.querySelector('#mark');
    const flash = document.querySelector('#flash');
    const layers = [...document.querySelectorAll('.glitch-layer')];
    const word = document.querySelector('.word');
    let running = false;
    let timer = 0;

    mark.replaceChildren(...layout.map(([letter, x, y, fs, rotation]) => {
      const glyph = document.createElement('i');
      glyph.className = `glyph${letter === 'Z' ? ' z' : ''}`;
      glyph.textContent = letter;
      glyph.style.setProperty('--x', x);
      glyph.style.setProperty('--y', y);
      glyph.style.setProperty('--fs', fs);
      glyph.style.setProperty('--r', `${rotation}deg`);
      return glyph;
    }));

    const random = (min, max) => min + Math.random() * (max - min);
    function tear() {
      word.style.transform = `translate(${random(-8, 8)}px, ${random(-3, 3)}px) skewX(${random(-3, 3)}deg)`;
      word.style.filter = Math.random() > .6 ? `blur(${random(.3, 1.3)}px)` : 'none';
      word.style.opacity = random(.62, 1);
      layers.forEach((layer, index) => {
        const top = random(0, 78);
        const band = random(7, 34);
        const direction = index === 1 ? -1 : 1;
        layer.style.opacity = random(.45, .95);
        layer.style.clipPath = Math.random() < .24
          ? 'none'
          : `inset(${top}% 0 ${Math.max(0, 100 - top - band)}% 0)`;
        layer.style.transform = `translate(${direction * random(7, 30)}px, ${random(-8, 8)}px) skewX(${random(-6, 6)}deg)`;
      });
    }

    function clearTear() {
      word.removeAttribute('style');
      layers.forEach(layer => layer.removeAttribute('style'));
    }

    function play() {
      if (running) return;
      running = true;
      document.body.className = 'running';
      stage.className = 'word-stage glitching';
      mark.className = 'mark';
      clearTear();

      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        stage.classList.add('gone');
        mark.classList.add('visible', 'dock');
        document.body.className = 'finished';
        return;
      }

      // One escalating signal failure affects the word as a single object. At its brightest frame
      // the word is replaced outright; there is intentionally no visible compression animation.
      let hits = 0;
      timer = setInterval(() => {
        tear();
        hits += 1;
        if (hits === 4 || hits === 8) flash.classList.toggle('hit', true);
      }, 46);

      setTimeout(() => {
        clearInterval(timer);
        clearTear();
        flash.classList.remove('hit');
        void flash.offsetWidth;
        flash.classList.add('hit');
        stage.classList.add('gone');
        mark.classList.add('visible');
      }, 520);

      setTimeout(() => mark.classList.add('dock'), 900);
      setTimeout(() => {
        document.body.className = 'finished';
        running = false;
      }, 1680);
    }

    function reset() {
      clearInterval(timer);
      running = false;
      document.body.className = '';
      stage.className = 'word-stage';
      mark.className = 'mark';
      flash.className = 'flash';
      clearTear();
    }

    addEventListener('wheel', play, { passive: true });
    addEventListener('touchstart', play, { passive: true });
    addEventListener('keydown', event => {
      if (['ArrowDown', 'PageDown', ' ', 'Enter'].includes(event.key)) play();
    });
    document.querySelector('#reset').addEventListener('click', reset);
  </script>
</body>
</html>
